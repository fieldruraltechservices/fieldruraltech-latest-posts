<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Latest Posts - Field & Rural Tech Services</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
  }

  h1 {
    text-align: center;
    color: #1a1a1a;
    margin-bottom: 30px;
    font-size: 1.8rem;
  }

  .frts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .frts-card {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    transition: transform 0.2s ease;
  }

  .frts-card:hover {
    transform: translateY(-4px);
  }

  .frts-card img {
    width: 100%;
    height: auto;
  }

  .frts-card h3 {
    font-size: 1.2rem;
    margin: 12px;
    color: #1a1a1a;
  }

  .frts-card p {
    margin: 0 12px 12px;
    color: #444;
    line-height: 1.4;
  }

  .frts-card a {
    display: inline-block;
    margin: 0 12px 16px;
    padding: 8px 14px;
    background: #0078ff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }

  .frts-card a:hover {
    background: #005fcc;
  }
</style>
</head>

<body>

<h1>Latest From Field & Rural Tech Services</h1>

<div class="frts-grid" id="posts"></div>

<script>
fetch("https://script.google.com/macros/s/AKfycbwcnhqjvWDBNJoqkOhHGHbcryPydFSyxSModU-i1Gb-xrdy_4tDX76xOFoKnW1FIcRd/exec")
  .then(res => res.text())
  .then(html => {
    document.getElementById("posts").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("posts").innerHTML =
      "<p style='text-align:center;color:#444;'>Unable to load posts right now.</p>";
  });
</script>

</body>
</html>
